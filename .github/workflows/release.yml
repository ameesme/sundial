name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="custom_components/sundial/manifest.json"
          version="$(jq -r .version "$manifest")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match manifest version $version. Bump $manifest before tagging."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build panel bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Ensure committed bundle is up to date
        run: |
          if ! git diff --quiet -- custom_components/sundial/frontend/dist; then
            echo "::error::Committed panel bundle is stale. Run 'npm run build' and commit before tagging."
            exit 1
          fi

      - name: Create integration zip
        run: |
          cd custom_components/sundial
          zip -r "$GITHUB_WORKSPACE/sundial.zip" .

      # HACS decides whether to hide a release from everyone but opted-in
      # testers from GitHub's prerelease flag, not from the version string —
      # and action-gh-release never infers that flag from the tag name. So
      # anything that isn't a plain vX.Y.Z is published as a pre-release;
      # without this a v2.1.0b1 tag would reach every user as a stable one.
      - name: Detect pre-release tag
        id: prerelease
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing $GITHUB_REF_NAME as a pre-release."
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: sundial.zip
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.value }}
